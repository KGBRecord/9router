services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 9router-dev
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - app_data:/app/data
      - app_data_home:/app/data-home
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:20128/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  app_data:
  app_data_home: